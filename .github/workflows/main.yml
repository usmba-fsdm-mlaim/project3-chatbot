name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chatbot-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/chatbot-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/chatbot-backend:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chatbot-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/chatbot-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/chatbot-frontend:latest
          cache-to: type=inline

      - name: Summary
        run: |
          echo "✅ Backend image: ${{ secrets.DOCKER_USERNAME }}/chatbot-backend:latest"
          echo "✅ Frontend image: ${{ secrets.DOCKER_USERNAME }}/chatbot-frontend:latest"
          echo "🏷️ Tag: ${{ github.sha }}"
