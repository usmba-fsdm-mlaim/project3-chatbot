global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend API Metrics (for Kubernetes)
  - job_name: "chatbot-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["chatbot-backend-service:8000"]
        labels:
          service: "backend"
          environment: "kubernetes"
          
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - "alerts.yml"
