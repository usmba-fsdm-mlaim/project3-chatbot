groups:
- name: chatbot-alerts
  rules:
  - alert: HighChatbotLatency
    expr: histogram_quantile(0.95, rate(chatbot_request_latency_seconds_bucket[2m])) > 2
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High chatbot latency"
      description: "P95 latency > 2s for 1 minute"
